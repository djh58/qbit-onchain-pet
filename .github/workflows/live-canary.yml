name: Live Canary

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or preview origin to probe
        required: false
        default: https://qbit-onchain-pet.thedanhepworth.chatgpt.site
        type: string

permissions:
  contents: read

concurrency:
  group: live-canary-${{ github.ref }}
  cancel-in-progress: true

# This workflow intentionally has no pull_request or push trigger. It exercises
# the public Sites host and explorer, so it must never become a required PR gate.
jobs:
  production-canary:
    name: Production canary (external)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      LIVE_BASE_URL: ${{ inputs.base_url || 'https://qbit-onchain-pet.thedanhepworth.chatgpt.site' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify live chain recovery
        run: npx playwright test --config=playwright.live.config.ts
        env:
          CI: "true"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-canary-failure-${{ github.run_attempt }}
          path: site/.next/playwright-live-results/
          if-no-files-found: error
          retention-days: 7
